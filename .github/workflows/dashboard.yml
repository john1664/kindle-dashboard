name: Generate Kindle Dashboard

on:
  schedule:
    # 每10分钟跑一次（GitHub Actions的定时任务不保证精确到分钟，可能有几分钟延迟）
    - cron: "*/10 * * * *"
  workflow_dispatch:  # 允许手动点击触发，方便调试

# 需要写入权限，才能把生成的图片推送到gh-pages分支
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体和依赖库
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow requests

      - name: 生成仪表盘图片
        run: python generate_dashboard.py

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
